services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bizops_owner
      POSTGRES_PASSWORD: bizops_owner_dev   # dev only
      POSTGRES_DB: bizops
    ports:
      - "127.0.0.1:55432:5432"   # change the left side if Windows Postgres already uses 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizops_owner -d bizops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
